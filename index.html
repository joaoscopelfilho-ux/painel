const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PACOTE.salt), iterations:PACOTE.iteracoes, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PACOTE.iv)}, k, b64(PACOTE.dados));
  return new TextDecoder().decode(claro);
}
async function tenta(senha, guardar) {
  try {
    const html = await abrir(senha);
    if (guardar) try { localStorage.setItem("painel_senha", senha); } catch {}
    document.open(); document.write(html); document.close();   // vira o painel; ele mesmo recarrega a cada 10 min
  } catch { document.getElementById("m").textContent = "Senha incorreta."; document.getElementById("m").className = "erro"; }
}
document.getElementById("f").onsubmit = e => { e.preventDefault(); tenta(document.getElementById("s").value, true); };
const frag = new URLSearchParams(location.hash.slice(1)).get("chave");   // #chave=... fica só no navegador, não vai ao servidor
let guardada = null; try { guardada = localStorage.getItem("painel_senha"); } catch {}
if (frag) tenta(frag, true); else if (guardada) tenta(guardada, false);
</script>
